      - token
      - uid
    Appointment:
      type: object
      description: |-
        Serializer for Appointment model.

        Read-only fields for status/payment/created; validates doctor time/fee.
        Derived: doctor_fee (read-only), can_cancel (time/status-based).
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: string
          readOnly: true
        doctor:
          type: integer
        time:
          type: integer
        doctor_fee:
          type: string
          readOnly: true
        can_cancel:
          type: string
          readOnly: true
        appointment_type:
          allOf:
          - $ref: '#/components/schemas/AppointmentType'
          description: |-
            Type: Online or Offline.

            * `Offline` - Offline
            * `Online` - Online
        appointment_status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatus'
          readOnly: true
          description: |-
            Status: Pending/Running/Completed/Cancelled.

            * `Pending` - Pending
            * `Running` - Running
            * `Completed` - Completed
            * `Cancelled` - Cancelled
        payment_status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatus'
          readOnly: true
          description: |-
            Payment: unpaid/paid/failed/refunded.

            * `unpaid` - Unpaid
            * `paid` - Paid
            * `failed` - Failed
            * `refunded` - Refunded
        stripe_session_id:
          type: string
          readOnly: true
          nullable: true
          description: Stripe session ID for online payments.
        payment_intent_id:
          type: string
          nullable: true
          description: Stripe payment intent ID.
          maxLength: 255
        symptom:
          type: string
          description: Patient-reported symptoms.
          maxLength: 500
        cancel:
          type: boolean
          readOnly: true
          description: Flag for cancelled appointments.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Creation timestamp.
      required:
      - appointment_status
      - appointment_type
      - can_cancel
      - cancel
      - created_at
      - doctor
      - doctor_fee
      - id
      - patient
      - payment_status
      - stripe_session_id
      - symptom
      - time
    AppointmentRequest:
      type: object
      description: |-
