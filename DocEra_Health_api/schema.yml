openapi: 3.0.3
info:
  title: DocEra Health API
  version: 2.0.1
  description: A clean and reliable backend for a Hospital Management System built
    with Django REST Framework. It handles patient info, doctor schedules, appointments
    (online & offline), and secure login with JWT and email verification. Online appointments
    trigger meet link emails automatically.
paths:
  /appointment/:
    get:
      operationId: appointment_list
      description: List appointments for authenticated user (or by patient_id query
        param for admins).
      parameters:
      - in: query
        name: patient_id
        schema:
          type: integer
        description: Filter by patient ID (admin only)
      tags:
      - Appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
              examples:
                OnlineAppointmentCreate:
                  value:
                  - doctor: 1
                    time: 1
                    appointment_type: Online
                    symptom: Fever and cough
                  summary: Online Appointment Create
                  description: Example for creating an online appointment.
                OfflineAppointmentCreate:
                  value:
                  - doctor: 2
                    time: 3
                    appointment_type: Offline
                    symptom: Back pain
                  summary: Offline Appointment Create
                  description: Example for creating an offline appointment.
          description: ''
    post:
      operationId: appointment_create
      description: Create offline appointment (use create-online for online). Triggers
        confirmation email.
      tags:
      - Appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
            examples:
              OfflineCreate:
                value:
                  doctor: 1
                  time: 1
                  appointment_type: Offline
                  symptom: Pain
                summary: Offline Create
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                OfflineCreate:
                  value:
                    doctor: 1
                    time: 1
                    appointment_type: Offline
                    symptom: Pain
                  summary: Offline Create
          description: ''
  /appointment/{id}/:
    get:
      operationId: appointment_retrieve
      description: Retrieve single appointment details.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - Appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                OnlineAppointmentCreate:
                  value:
                    doctor: 1
                    time: 1
                    appointment_type: Online
                    symptom: Fever and cough
                  summary: Online Appointment Create
                  description: Example for creating an online appointment.
                OfflineAppointmentCreate:
                  value:
                    doctor: 2
                    time: 3
                    appointment_type: Offline
                    symptom: Back pain
                  summary: Offline Appointment Create
                  description: Example for creating an offline appointment.
          description: ''
    put:
      operationId: appointment_update
      description: Update appointment (restricted).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - Appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
            examples:
              OnlineAppointmentCreate:
                value:
                  doctor: 1
                  time: 1
                  appointment_type: Online
                  symptom: Fever and cough
                summary: Online Appointment Create
                description: Example for creating an online appointment.
              OfflineAppointmentCreate:
                value:
                  doctor: 2
                  time: 3
                  appointment_type: Offline
                  symptom: Back pain
                summary: Offline Appointment Create
                description: Example for creating an offline appointment.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                OnlineAppointmentCreate:
                  value:
                    doctor: 1
                    time: 1
                    appointment_type: Online
                    symptom: Fever and cough
                  summary: Online Appointment Create
                  description: Example for creating an online appointment.
                OfflineAppointmentCreate:
                  value:
                    doctor: 2
                    time: 3
                    appointment_type: Offline
                    symptom: Back pain
                  summary: Offline Appointment Create
                  description: Example for creating an offline appointment.
          description: ''
    patch:
      operationId: appointment_partial_update
      description: Partial update (restricted).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - Appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
            examples:
              OnlineAppointmentCreate:
                value:
                  doctor: 1
                  time: 1
                  appointment_type: Online
                  symptom: Fever and cough
                summary: Online Appointment Create
                description: Example for creating an online appointment.
              OfflineAppointmentCreate:
                value:
                  doctor: 2
                  time: 3
                  appointment_type: Offline
                  symptom: Back pain
                summary: Offline Appointment Create
                description: Example for creating an offline appointment.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                OnlineAppointmentCreate:
                  value:
                    doctor: 1
                    time: 1
                    appointment_type: Online
                    symptom: Fever and cough
                  summary: Online Appointment Create
                  description: Example for creating an online appointment.
                OfflineAppointmentCreate:
                  value:
                    doctor: 2
                    time: 3
                    appointment_type: Offline
                    symptom: Back pain
                  summary: Offline Appointment Create
                  description: Example for creating an offline appointment.
          description: ''
    delete:
      operationId: appointment_destroy
      description: Delete appointment (restricted).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - Appointments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /appointment/{id}/cancel_appointment/:
    post:
      operationId: appointment_cancel_appointment_create
      description: Cancel appointment if eligible (within 24h, not completed). Refunds
